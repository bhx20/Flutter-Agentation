    }

      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;

    /* Custom Flutter Agentation Splash Loader */
    #app-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    .logo-pulse {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoFadeInOut 1.8s ease-in-out infinite alternate;
    }
    @keyframes logoFadeInOut {
      0% {
        opacity: 0.15;
        transform: scale(0.97);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

  <script>
    function dismissAppLoader() {
      const loader = document.getElementById('app-loader');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }

    // Fallback: dismiss when Flutter view or glass pane is attached
    const observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
        dismissAppLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener('flutter-first-frame', dismissAppLoader);
  </script>

  <script src="flutter_bootstrap.js" async></script>

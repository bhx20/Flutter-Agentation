<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta
      name="description"
      content="Visual UI feedback & MCP server engine for Flutter apps and AI coding agents."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Flutter Agentation" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon: Modern SVG for crisp rendering + PNG fallback -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />

    <title>Flutter Agentation</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      html, body {
        scroll-behavior: smooth;
      }

      /* Clean minimal selected text decoration matching user specification */
      ::selection {
        background: #ededed;
        color: #111827;
      }
      ::-moz-selection {
        background: #ededed;
        color: #111827;
      }

      /* Classic desktop scrollbar with steppers and grip matching user specification */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #f8fafc;
        border-left: 1px solid #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border: 2px solid #f8fafc;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      ::-webkit-scrollbar-button:single-button:vertical:decrement {
        height: 16px;
        width: 14px;
        background: #ededed url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='16' viewBox='0 0 14 16'%3E%3Cpolygon points='7,5 11,11 3,11' fill='%23475569'/%3E%3C/svg%3E") no-repeat center center;
        border-bottom: 1px solid #d1d5db;
        border-left: 1px solid #e2e8f0;
      }
      ::-webkit-scrollbar-button:single-button:vertical:decrement:hover {
        background-color: #e0e0e0;
      }
      ::-webkit-scrollbar-button:single-button:vertical:increment {
        height: 16px;
        width: 14px;
        background: #ededed url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='16' viewBox='0 0 14 16'%3E%3Cpolygon points='7,11 11,5 3,5' fill='%23475569'/%3E%3C/svg%3E") no-repeat center center;
        border-top: 1px solid #d1d5db;
        border-left: 1px solid #e2e8f0;
      }
      ::-webkit-scrollbar-button:single-button:vertical:increment:hover {
        background-color: #e0e0e0;
      }

      /* Custom Flutter Agentation Splash Loader */
      #app-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
        background-size: 24px 24px;
        background-position: center center;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }

      /* Foreground Logo with smooth fade in/out pulse (Center is completely clear) */
      .logo-pulse {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 44px;
        border-radius: 999px;
        background: radial-gradient(ellipse at center, rgba(248, 250, 252, 0.96) 50%, rgba(248, 250, 252, 0) 85%);
        animation: logoFadeInOut 2.2s ease-in-out infinite alternate;
      }

      .loader-logo-img {
        display: block;
        height: 32px;
        width: auto;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(15, 23, 42, 0.08));
      }

      @keyframes logoFadeInOut {
        0% {
          opacity: 0.25;
          transform: scale(0.97);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Background Canvas (0.4 Opacity): Scattered Widgets & Animated Feedback Workflow */
      .bg-scene {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.4;
        z-index: 1;
        overflow: hidden;
      }

      /* Scattered Dummy Widgets placed around the canvas (outside center logo) */
      .scatter-widget {
        position: absolute;
        pointer-events: none;
      }

      /* Widget A: Top-Left FilledButton */
      .widget-a {
        top: 18%;
        left: 12%;
      }

      .flutter-btn {
        width: 144px;
        height: 38px;
        background: #2563EB;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }

      .flutter-btn .btn-icon {
        width: 14px;
        height: 14px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 3px;
      }

      /* Widget B: Bottom-Right Card */
      .widget-b {
        bottom: 20%;
        right: 12%;
      }

      .flutter-card {
        width: 210px;
        height: 72px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .card-icon-box {
        width: 44px;
        height: 44px;
        background: #eff6ff;
        border-radius: 8px;
        border: 1px solid #dbeafe;
        flex-shrink: 0;
      }

      .card-lines {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .card-line-title {
        height: 12px;
        background: #94a3b8;
        border-radius: 3px;
        width: 85%;
      }

      .card-line-sub {
        height: 9px;
        background: #cbd5e1;
        border-radius: 3px;
        width: 60%;
      }

      /* Widget C: Bottom-Left Chip */
      .widget-c {
        bottom: 22%;
        left: 15%;
      }

      .flutter-chip {
        padding: 7px 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 600;
        color: #334155;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      }

      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #10b981;
      }

      /* Widget D: Top-Right Input Field */
      .widget-d {
        top: 19%;
        right: 15%;
      }

      .flutter-input {
        width: 170px;
        height: 36px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #94a3b8;
        font-size: 11px;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      }

      .search-icon-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid #94a3b8;
      }

      /* Inspection Outlines for Widgets */
      .widget-inspect-outline {
        position: absolute;
        inset: -5px;
        border: 1.5px dashed #2563EB;
        border-radius: 10px;
        background: rgba(37, 99, 235, 0.05);
        pointer-events: none;
        opacity: 0;
      }

      .outline-a {
        animation: inspectOutlineA 10s ease-in-out infinite;
      }

      .outline-b {
        animation: inspectOutlineB 10s ease-in-out infinite;
      }

      .corner {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #2563EB;
        border: 1.2px solid #ffffff;
        border-radius: 1px;
      }
      .c-tl { top: -3px; left: -3px; }
      .c-tr { top: -3px; right: -3px; }
      .c-bl { bottom: -3px; left: -3px; }
      .c-br { bottom: -3px; right: -3px; }

      .widget-chip {
        position: absolute;
        top: -11px;
        left: 6px;
        background: #2563EB;
        color: #ffffff;
        font-size: 9px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        white-space: nowrap;
      }

      /* Click Ripple Effects */
      .click-ripple {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #2563EB;
        background: rgba(37, 99, 235, 0.25);
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        pointer-events: none;
      }

      .ripple-a {
        animation: rippleEffectA 10s ease-out infinite;
      }

      .ripple-b {
        animation: rippleEffectB 10s ease-out infinite;
      }

      /* Feedback Dialog Popovers (Clean Light Theme) */
      .feedback-popover {
        position: absolute;
        width: 215px;
        background: #ffffff;
        border-radius: 10px;
        padding: 11px 12px;
        box-shadow: 0 16px 36px -4px rgba(15, 23, 42, 0.12), 0 0 0 1px #e2e8f0;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 30;
        opacity: 0;
        pointer-events: none;
      }

      .popover-a {
        top: 48px;
        left: 0;
        animation: popoverAnimA 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      .popover-b {
        bottom: 82px;
        right: 0;
        animation: popoverAnimB 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      .popover-header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .popover-file {
        font-size: 8.5px;
        font-weight: 600;
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, monospace;
        letter-spacing: 0.2px;
      }

      .popover-input {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 6px 8px;
        min-height: 24px;
        display: flex;
        align-items: center;
        gap: 1px;
      }

      .typing-text {
        font-size: 10.5px;
        font-weight: 500;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        display: inline-block;
      }

      .typing-a {
        width: 0;
        animation: typeTextA 10s steps(26, end) infinite;
      }

      .typing-b {
        width: 0;
        animation: typeTextB 10s steps(26, end) infinite;
      }

      .typing-caret {
        display: inline-block;
        width: 1.5px;
        height: 12px;
        background: #2563EB;
        animation: caretBlink 0.7s infinite alternate;
      }

      .popover-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 2px;
      }

      .popover-btn-cancel {
        font-size: 9.5px;
        color: #64748b;
        padding: 3px 6px;
      }

      .popover-btn-done {
        font-size: 9.5px;
        font-weight: 600;
        background: #2563EB;
        color: #ffffff;
        padding: 3px 10px;
        border-radius: 4px;
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.2);
      }

      .done-btn-a {
        animation: doneBtnClickA 10s ease-in-out infinite;
      }

      .done-btn-b {
        animation: doneBtnClickB 10s ease-in-out infinite;
      }

      /* Saved Annotation Pins */
      .saved-pin {
        position: absolute;
        top: -10px;
        right: -8px;
        width: 22px;
        height: 22px;
        background: #2563EB;
        color: #ffffff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10.5px;
        font-weight: 700;
        box-shadow: 0 0 0 2.5px rgba(37, 99, 235, 0.25), 0 3px 8px rgba(0, 0, 0, 0.15);
        opacity: 0;
        z-index: 20;
      }

      .pin-a {
        animation: pinAnimA 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      .pin-b {
        animation: pinAnimB 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      /* Animated Global Pointer Cursor traversing the screen */
      .anim-global-cursor {
        position: absolute;
        width: 24px;
        height: 24px;
        pointer-events: none;
        z-index: 50;
        filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.35));
        animation: globalCursorTravel 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      /* Timeline Keyframes (10s continuous cycle) */

      /* 1. Cursor Flight Path */
      @keyframes globalCursorTravel {
        0% {
          top: 6%;
          left: 4%;
          opacity: 0;
          transform: scale(1);
        }
        7% {
          top: calc(18% + 18px);
          left: calc(12% + 72px);
          opacity: 1;
          transform: scale(1);
        }
        11% {
          top: calc(18% + 18px);
          left: calc(12% + 72px);
          transform: scale(0.85);
        }
        14% {
          top: calc(18% + 18px);
          left: calc(12% + 72px);
          transform: scale(1);
        }
        28% {
          top: calc(18% + 18px);
          left: calc(12% + 72px);
        }
        32% {
          top: calc(18% + 115px);
          left: calc(12% + 190px);
          transform: scale(1);
        }
        34% {
          top: calc(18% + 115px);
          left: calc(12% + 190px);
          transform: scale(0.85);
        }
        37% {
          top: calc(18% + 115px);
          left: calc(12% + 190px);
          transform: scale(1);
        }
        48% {
          top: 60%;
          left: 56%;
          transform: scale(1);
        }
        54% {
          top: calc(80% - 34px);
          left: calc(88% - 90px);
          transform: scale(1);
        }
        57% {
          top: calc(80% - 34px);
          left: calc(88% - 90px);
          transform: scale(0.85);
        }
        60% {
          top: calc(80% - 34px);
          left: calc(88% - 90px);
          transform: scale(1);
        }
        72% {
          top: calc(80% - 34px);
          left: calc(88% - 90px);
        }
        76% {
          top: calc(80% - 30px);
          left: calc(88% - 25px);
          transform: scale(1);
        }
        78% {
          top: calc(80% - 30px);
          left: calc(88% - 25px);
          transform: scale(0.85);
        }
        81% {
          top: calc(80% - 30px);
          left: calc(88% - 25px);
          transform: scale(1);
        }
        89% {
          top: 92%;
          left: 95%;
          opacity: 0;
          transform: scale(1);
        }
        100% {
          top: 6%;
          left: 4%;
          opacity: 0;
          transform: scale(1);
        }
      }

      /* 2. Widget A Animations */
      @keyframes inspectOutlineA {
        0%, 5% { opacity: 0; transform: scale(0.96); }
        7%, 34% { opacity: 1; transform: scale(1); }
        37%, 100% { opacity: 0; transform: scale(1); }
      }

      @keyframes rippleEffectA {
        0%, 11% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        12% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
        19% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
      }

      @keyframes popoverAnimA {
        0%, 13% { opacity: 0; transform: translateY(-8px) scale(0.9); }
        16%, 34% { opacity: 1; transform: translateY(0) scale(1); }
        37%, 100% { opacity: 0; transform: translateY(6px) scale(0.92); }
      }

      @keyframes typeTextA {
        0%, 16% { width: 0; }
        27%, 36% { width: 140px; }
        37%, 100% { width: 0; }
      }

      @keyframes doneBtnClickA {
        0%, 33% { transform: scale(1); }
        34% { transform: scale(0.88); background: #1d4ed8; }
        36%, 100% { transform: scale(1); }
      }

      @keyframes pinAnimA {
        0%, 35% { opacity: 0; transform: scale(0.5); }
        38%, 88% { opacity: 1; transform: scale(1); }
        92%, 100% { opacity: 0; transform: scale(0.8); }
      }

      /* 3. Widget B Animations */
      @keyframes inspectOutlineB {
        0%, 51% { opacity: 0; transform: scale(0.96); }
        54%, 78% { opacity: 1; transform: scale(1); }
        81%, 100% { opacity: 0; transform: scale(1); }
      }

      @keyframes rippleEffectB {
        0%, 57% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        58% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
        65% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
      }

      @keyframes popoverAnimB {
        0%, 59% { opacity: 0; transform: translateY(8px) scale(0.9); }
        62%, 78% { opacity: 1; transform: translateY(0) scale(1); }
        81%, 100% { opacity: 0; transform: translateY(-6px) scale(0.92); }
      }

      @keyframes typeTextB {
        0%, 62% { width: 0; }
        71%, 79% { width: 135px; }
        81%, 100% { width: 0; }
      }

      @keyframes doneBtnClickB {
        0%, 77% { transform: scale(1); }
        78% { transform: scale(0.88); background: #1d4ed8; }
        80%, 100% { transform: scale(1); }
      }

      @keyframes pinAnimB {
        0%, 79% { opacity: 0; transform: scale(0.5); }
        82%, 91% { opacity: 1; transform: scale(1); }
        94%, 100% { opacity: 0; transform: scale(0.8); }
      }

      @keyframes caretBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

    </style>
  </head>
  <body>
    <!-- Flutter Agentation Custom Brand Loader -->
    <div id="app-loader">
      <!-- Background Scene (0.4 Opacity): Scattered Widgets & Interactive Annotation Workflow -->
      <div class="bg-scene">
        <!-- Widget A (Top-Left): FilledButton with live inspection & feedback dialog -->
        <div class="scatter-widget widget-a">
          <div class="flutter-btn">
            <span class="btn-icon"></span>
            <span>Submit Action</span>
          </div>
          <div class="widget-inspect-outline outline-a">
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>
            <span class="widget-chip">FilledButton • 144×38</span>
          </div>
          <div class="click-ripple ripple-a"></div>
          <div class="feedback-popover popover-a">
            <div class="popover-header">
              <span class="popover-file">overview.dart:104</span>
            </div>
            <div class="popover-input">
              <span class="typing-text typing-a"
                >Update button radius & label</span
              >
              <span class="typing-caret"></span>
            </div>
            <div class="popover-footer">
              <span class="popover-btn-cancel">Cancel</span>
              <span class="popover-btn-done done-btn-a">Done</span>
            </div>
          </div>
          <div class="saved-pin pin-a">1</div>
        </div>

        <!-- Widget B (Bottom-Right): Card with live inspection & feedback dialog -->
        <div class="scatter-widget widget-b">
          <div class="flutter-card">
            <div class="card-icon-box"></div>
            <div class="card-lines">
              <div class="card-line-title"></div>
              <div class="card-line-sub"></div>
            </div>
          </div>
          <div class="widget-inspect-outline outline-b">
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>
            <span class="widget-chip">Card • 210×72</span>
          </div>
          <div class="click-ripple ripple-b"></div>
          <div class="feedback-popover popover-b">
            <div class="popover-header">
              <span class="popover-file">card.dart:36</span>
            </div>
            <div class="popover-input">
              <span class="typing-text typing-b">Add 16px bottom padding</span>
              <span class="typing-caret"></span>
            </div>
            <div class="popover-footer">
              <span class="popover-btn-cancel">Cancel</span>
              <span class="popover-btn-done done-btn-b">Done</span>
            </div>
          </div>
          <div class="saved-pin pin-b">2</div>
        </div>

        <!-- Widget C (Bottom-Left): Scattered FilterChip -->
        <div class="scatter-widget widget-c">
          <div class="flutter-chip">
            <span class="chip-dot"></span>
            <span>Theme Selector</span>
          </div>
        </div>

        <!-- Widget D (Top-Right): Scattered Search Field -->
        <div class="scatter-widget widget-d">
          <div class="flutter-input">
            <span class="search-icon-dot"></span>
            <span>Search widgets...</span>
          </div>
        </div>

        <!-- Global Animated Cursor flying across the screen (Light theme with blue accent outline) -->
        <svg
          class="anim-global-cursor"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 2L20 10.5L12.5 13L9.5 20.5L4 2Z"
            fill="#FFFFFF"
            stroke="#2563EB"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <!-- Foreground Logo with smooth fade in/out pulse (Center is completely clear) -->
      <div class="logo-pulse">
        <img
          src="logo.png"
          height="32"
          alt="Flutter Agentation"
          class="loader-logo-img"
        />
      </div>
    </div>

    <script>
      function dismissAppLoader() {
        const loader = document.getElementById("app-loader");
        if (loader && loader.style.display !== "none" && loader.style.opacity !== "0") {
          loader.style.transition = "opacity 0.4s ease-out";
          loader.style.opacity = "0";
          loader.style.pointerEvents = "none";
          setTimeout(function () {
            loader.style.visibility = "hidden";
            loader.style.display = "none";
          }, 400);
        }
      }

      window.dismissAppLoader = dismissAppLoader;

      // Engine frame fallback: dismiss once Flutter engine renders its frame
      window.addEventListener("flutter-first-frame", function () {
        requestAnimationFrame(function () {
          setTimeout(dismissAppLoader, 150);
        });
      });

      // Safety fallback: dismiss loader if Flutter takes unusually long
      setTimeout(dismissAppLoader, 8000);
    </script>

    Flutter web bootstrap script
  -->
    <script src="flutter_bootstrap.js" async></script>
